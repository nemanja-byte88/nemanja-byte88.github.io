<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurevia Operations · concept demo by NB Digital Labs</title>
<meta name="description" content="Concept demo of a resort back office: occupancy, bookings, rooms and revenue with role-based access. Fictional resort, built by NB Digital Labs.">
<meta name="theme-color" content="#3A2F26">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F4EEE3;--ink:#3A2F26;--olive:#6B7048;--sage:#A9B08F;--sand:#EAE0CF;--terra:#B7683E;--ok:#5d7a3a;--warn:#b7883e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
.demo{background:var(--ink);color:var(--sand);font-size:12px;padding:7px 16px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;padding-top:calc(7px + env(safe-area-inset-top,0))}
.demo a{color:var(--sage);text-decoration:none}.demo a:hover{color:#fff}
header{background:var(--olive);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{font:600 24px 'Cormorant Garamond',serif;letter-spacing:.5px}.brand small{font:300 12px Jost;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-left:8px}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
select,input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--sage);border-radius:6px;padding:7px 10px}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--sage);flex-wrap:wrap}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--ink)}
nav button.on{border-color:var(--terra);font-weight:500}
nav button.lock{opacity:.45}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.note{font-size:13px;color:#6a5d50;margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--sand);border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px rgba(58,47,38,.05)}
.kpi b{display:block;font:600 34px 'Cormorant Garamond',serif;color:var(--olive)}.kpi span{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7a6c5d}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
h2{font-size:26px;margin-bottom:10px}h3{font-size:20px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--sand);white-space:nowrap}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7a6c5d;font-weight:500}
.wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--sand)}
.p-In{background:#dfe8c8}.p-Co{background:#e6edf5}.p-Pe{background:#f3e3c2}.p-Ch{background:var(--sand);color:#7a6c5d}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.room{padding:0;overflow:hidden}.room img{display:block;width:100%;height:110px;object-fit:cover;background:var(--sage)}
.room div{padding:12px 14px}.room h3{margin-bottom:2px}
.strip{display:flex;gap:2px;margin:8px 0}.strip i{flex:1;height:8px;border-radius:2px;background:var(--sand)}.strip i.o{background:var(--olive)}
button.act:disabled{opacity:.5}.chips{display:flex;flex-wrap:wrap;gap:6px}ul.list a,.card>a{color:var(--olive)}button.act{font:inherit;background:var(--terra);color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;margin:0}.room button.act{margin-top:6px}
ul.list{list-style:none;margin:0;padding:0}ul.list li{padding:8px 0;border-bottom:1px solid var(--sand);display:flex;justify-content:space-between;gap:10px;font-size:14px}
svg text{font:11px Jost;fill:#7a6c5d}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:12px;color:#7a6c5d;padding:20px}
</style></head><body>
<div class="demo"><span>Concept demo · fictional resort · all data is sample data</span><span><a href="../../work.html">← Back to NB Digital Labs</a> · <a href="../aurevia/">Aurevia website ↗</a> · <a href="../../work.html">Build something like this ↗</a></span></div>
<header><div class="brand">Aurevia<small>Operations</small></div>
<label class="who">Signed in as <select id="role"><option value="owner">Owner / General Manager</option><option value="reception">Reception</option><option value="housekeeping">Housekeeping</option></select></label></header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer>© 2026 Aurevia Family Resort · fictional concept · Made by <a href="../../work.html" style="color:inherit">NB Digital Labs</a></footer>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const TYPES=[{id:'ulivo',name:'Camera Ulivo',rate:165,n:4,pre:'U',img:'room-ulivo'},{id:'vigna',name:'Suite Vigna',rate:215,n:3,pre:'V',img:'room-vigna'},{id:'casetta',name:'Casetta Famiglia',rate:290,n:2,pre:'C',img:'family-house'}];
const UNITS=TYPES.flatMap(t=>Array.from({length:t.n},(_,i)=>({id:t.pre+(i+1),type:t})));
const today=new Date();today.setHours(0,0,0,0);
const dateOf=o=>{const d=new Date(today);d.setDate(d.getDate()+o);return d};
const fmt=o=>dateOf(o).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
let seed=20261109;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const FIRST=['Anna','Luca','Marta','Jonas','Elena','Tomás','Sofia','Marko','Clara','Daniel','Ivana','Paolo','Nora','Felix','Lidia','Mateo'],LAST=['Rossi','Keller','Novak','García','Weber','Marino','Horvat','Bianchi','Lang','Costa','Petrović','Moretti'];
const B=[];let ref=1040;
UNITS.forEach(u=>{let d=-150+Math.floor(rnd()*4);while(d<60){const nights=2+Math.floor(rnd()*6),s=d,e=d+nights;
 const status=e<0?'Checked out':s<0?'In house':s===0?'Confirmed':rnd()<.15?'Pending':'Confirmed';
 B.push({ref:'AV-'+(ref++),unit:u,s,e,nights,status,guest:FIRST[Math.floor(rnd()*16)]+' '+LAST[Math.floor(rnd()*12)],pax:1+Math.floor(rnd()*(u.type.id==='casetta'?5:3))});
 d=e+Math.floor(rnd()*2)}});
B.sort((a,b)=>a.s-b.s);
const LOG=[];
const ROLES={owner:['overview','bookings','rooms','revenue'],reception:['overview','bookings','rooms'],housekeeping:['rooms']};
const TAB={overview:'Overview',bookings:'Bookings',rooms:'Rooms',revenue:'Revenue'};
let role='owner',tab='overview',F={q:'',status:'',type:''};
const eur=n=>'€'+Math.round(n).toLocaleString('en-US');
const occ=o=>B.filter(b=>b.s<=o&&o<b.e).length;
const dirty=new Set(B.filter(b=>b.e===0&&b.status==='In house').map(b=>b.unit.id));
const curM=today.getFullYear()*12+today.getMonth();
const SHOPF=[.07,.08,.075,.09,.085,.095];
function monthStats(m){const t={},n={};TYPES.forEach(x=>{t[x.id]=0;n[x.id]=0});B.forEach(b=>{if(b.status==='Pending')return;for(let o=b.s;o<b.e;o++){const d=dateOf(o);if(d.getFullYear()*12+d.getMonth()===m){t[b.unit.type.id]+=b.unit.type.rate;n[b.unit.type.id]++}}});const rooms=Object.values(t).reduce((a,b)=>a+b,0);return{t,n,rooms,nights:Object.values(n).reduce((a,b)=>a+b,0),shop:Math.round(rooms*SHOPF[((m%6)+6)%6])}}
const who=()=>$('#role').selectedOptions[0].text;
const stamp=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
const can=a=>role==='owner'||(role==='reception'&&a!=='clean')||(role==='housekeeping'&&a==='clean');
function act(a,ref){if(!can(a)){LOG.unshift(`${stamp()} · ${who()} tried to ${a==='clean'?'mark a room clean':'check a guest '+a} · blocked`);toast(`Access denied for ${who()}. The attempt was logged.`);return}
 if(a==='clean'){if(B.some(x=>x.unit.id===ref&&x.status==='In house')){toast('The guest has not checked out yet.');return}dirty.delete(ref);LOG.unshift(`${stamp()} · ${who()} marked ${ref} clean`);toast('Room marked clean. Reception now sees it as ready.')}
 else{const b=B.find(x=>x.ref===ref);if(a==='in'){if(dirty.has(b.unit.id)){toast('Room not ready yet. Housekeeping must mark it clean first.');return}b.status='In house';LOG.unshift(`${stamp()} · ${who()} checked in ${b.guest} (${b.unit.id})`);toast(b.guest+' checked in.')}
 else{b.status='Checked out';dirty.add(b.unit.id);LOG.unshift(`${stamp()} · ${who()} checked out ${b.guest} (${b.unit.id})`);toast(b.guest+' checked out. Room sent to housekeeping.')}}
 render()}
const btn=b=>!can('in')?'':b.s===0&&b.status==='Confirmed'?`<button class="act" data-a="in" data-r="${b.ref}">Check in</button>`:b.e===0&&b.status==='In house'?`<button class="act" data-a="out" data-r="${b.ref}">Check out</button>`:'';
function bars(vals,labels,w,h,fmtv,v2,hi){const max=Math.max(...vals.map((v,i)=>v+(v2?v2[i]:0)),1),bw=w/vals.length;
 return `<svg viewBox="0 0 ${w} ${h+22}" width="100%" role="img">${vals.map((v,i)=>{const bh=v/max*h,sh=v2?v2[i]/max*h:0;return `<rect x="${i*bw+2}" y="${h-bh}" width="${bw-4}" height="${bh}" rx="3" fill="${!v2&&i===hi?'#B7683E':'#6B7048'}"><title>${labels[i]}: ${fmtv?fmtv(v):v}</title></rect>`+(v2?`<rect x="${i*bw+2}" y="${h-bh-sh}" width="${bw-4}" height="${sh}" rx="3" fill="#B7683E"><title>${labels[i]} shop: ${eur(v2[i])}</title></rect>`:'')+(labels[i]?`<text x="${i*bw+bw/2}" y="${h+15}" text-anchor="middle">${labels[i]}</text>`:'')}).join('')}</svg>`}
function tabs(){$('#tabs').innerHTML=Object.keys(TAB).map(k=>{const ok=ROLES[role].includes(k);return `<button class="${k===tab?'on':''} ${ok?'':'lock'}" data-t="${k}">${ok?'':'🔒 '}${TAB[k]}</button>`}).join('')}
$('#tabs').onclick=e=>{const k=e.target.dataset.t;if(!k)return;if(!ROLES[role].includes(k)){LOG.unshift(`${stamp()} · ${who()} tried to open ${TAB[k]} · blocked`);toast(`Access denied for ${who()}. The attempt was logged.`);return}tab=k;render()};
$('#role').onchange=e=>{role=e.target.value;if(!ROLES[role].includes(tab))tab=ROLES[role][0];render();toast('Now viewing as '+who())};
const pill=t=>`<span class="pill p-${t.slice(0,2)}">${t}</span>`;
function overview(){const arr=B.filter(b=>b.s===0),dep=B.filter(b=>b.e===0),n=UNITS.length,o=occ(0),ms=monthStats(curM),own=role==='owner';
 const vals=Array.from({length:30},(_,i)=>Math.round(occ(i)/n*100)),labs=vals.map((_,i)=>i%5===0?fmt(i):'');
 const li=(b,out)=>`<li><span>${out?'↑':'↓'} ${b.guest} · ${b.unit.id}</span><span>${btn(b)||pill(b.status==='In house'?'In house':b.status)}</span></li>`;
 const hk=UNITS.map(u=>({u,d:dirty.has(u.id)}));
 return `<h2>Today at Aurevia</h2><p class="note">${today.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · ${n} rooms across 3 types</p>
 <div class="kpis"><div class="card kpi"><b>${Math.round(o/n*100)}%</b><span>Occupancy today</span></div><div class="card kpi"><b>${arr.filter(b=>b.status==='Confirmed').length}/${arr.length}</b><span>Arrivals still to check in</span></div><div class="card kpi"><b>${dep.filter(b=>b.status==='In house').length}/${dep.length}</b><span>Departures still to check out</span></div>
 ${own?`<div class="card kpi"><b>${eur(ms.rooms+ms.shop)}</b><span>Revenue this month</span></div>`:''}</div>
 <div class="grid2"><div class="card"><h3>Occupancy, next 30 days</h3>${bars(vals,labs,600,120,v=>v+'%',null,0)}</div>
 <div class="card"><h3>Arrivals</h3><ul class="list">${arr.map(b=>li(b,0)).join('')||'<li>None today</li>'}</ul><h3 style="margin-top:14px">Departures</h3><ul class="list">${dep.map(b=>li(b,1)).join('')||'<li>None today</li>'}</ul></div></div>
 <div class="card" style="margin-top:14px"><h3>Housekeeping status</h3><p class="note" style="margin:0 0 8px">Updated live when housekeeping marks a room clean.</p><div class="chips">${hk.map(x=>`<span class="pill ${x.d?'p-Pe':'p-In'}">${x.u.id} · ${x.d?'needs cleaning':'ready'}</span>`).join('')}</div></div>
 ${own?`<div class="grid2" style="margin-top:14px"><div class="card"><h3>Access &amp; activity log</h3><ul class="list">${LOG.slice(0,6).map(l=>`<li>${l}</li>`).join('')||'<li>Nothing yet. Try a check-in, or switch role and open a locked tab.</li>'}</ul></div><div class="card"><h3>Connected systems</h3><ul class="list"><li><a href="../aurevia/">Aurevia Family Resort · website ↗</a></li><li><a href="../pantry/#admin">Aurevia Pantry · shop admin ↗</a></li></ul></div></div>`:''}`}
function bookings(){const q=F.q.toLowerCase(),rows=B.filter(b=>b.e>-30&&b.s<45&&(!F.status||b.status===F.status)&&(!F.type||b.unit.type.id===F.type)&&(!q||(b.guest+b.ref).toLowerCase().includes(q))).slice(0,60);
 return `<h2>Bookings</h2><p class="note">Sample reservations around today. Filter by status, room type or guest. Today’s arrivals and departures can be checked in or out here.</p>
 <div class="filters"><input id="fq" placeholder="Search guest or reference" value="${F.q}"><select id="fs"><option value="">All statuses</option>${['In house','Confirmed','Pending','Checked out'].map(s=>`<option ${F.status===s?'selected':''}>${s}</option>`).join('')}</select><select id="ft"><option value="">All room types</option>${TYPES.map(t=>`<option value="${t.id}" ${F.type===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
 <div class="card wrap"><table><tr><th>Ref</th><th>Guest</th><th>Room</th><th>Stay</th><th>Guests</th><th>Total</th><th>Status</th><th></th></tr>${rows.map(b=>`<tr><td>${b.ref}</td><td>${b.guest}</td><td>${b.unit.type.name} · ${b.unit.id}</td><td>${fmt(b.s)} → ${fmt(b.e)} (${b.nights}n)</td><td>${b.pax}</td><td>${eur(b.nights*b.unit.type.rate)}</td><td>${pill(b.status)}</td><td>${btn(b)}</td></tr>`).join('')||'<tr><td colspan="8">No bookings match.</td></tr>'}</table></div>`}
const occ14=(u,i)=>B.some(b=>b.unit===u&&b.s<=i&&i<b.e);
function ustat(u){const ih=B.find(b=>b.unit===u&&b.status==='In house'),ar=B.find(b=>b.unit===u&&b.s===0&&b.status==='Confirmed');
 if(ih)return[ih.e===0?'Departing today':'Occupied',ih];if(dirty.has(u.id))return['Needs cleaning',null];return[ar?'Arriving today · ready':'Vacant · clean',null]}
function rooms(){const hk=role==='housekeeping';
 return `<h2>Rooms</h2><p class="note">${hk?'Housekeeping view: room status only, no guest details.':'Live room status with a 14-day occupancy strip.'}${can('clean')?' You can mark rooms clean.':' Cleaning is marked by housekeeping.'}</p><div class="rooms">${UNITS.map(u=>{const[st,cur]=ustat(u);
 const strip=Array.from({length:14},(_,i)=>`<i class="${occ14(u,i)?'o':''}" title="${fmt(i)}"></i>`).join('');
 const g=!hk&&cur?`<div class="note" style="margin:4px 0 0">${cur.guest} · until ${fmt(cur.e)}</div>`:'';
 return `<div class="card room"><img src="../aurevia/img/${u.type.img}.webp" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div><h3>${u.type.name} · ${u.id}</h3><span class="pill ${st==='Needs cleaning'?'p-Pe':''}">${st}</span>${g}<div class="strip" aria-label="Next 14 days">${strip}</div>${st==='Needs cleaning'&&can('clean')?`<button class="act" data-a="clean" data-r="${u.id}">Mark clean</button>`:''}</div></div>`}).join('')}</div>`}
function revenue(){const ms=Array.from({length:6},(_,i)=>curM-5+i),S=ms.map(monthStats),cur=S[5],lab=m=>new Date(Math.floor(m/12),m%12,1).toLocaleDateString('en-GB',{month:'short'}),tot=cur.rooms+cur.shop,orders=Math.round(cur.shop/38);
 return `<h2>Revenue</h2><p class="note">Owner / General Manager only. Rooms come from the generated bookings (pending excluded); shop figures are sample data from Aurevia Pantry.</p>
 <div class="kpis"><div class="card kpi"><b>${eur(tot)}</b><span>Total this month</span></div><div class="card kpi"><b>${eur(cur.rooms)}</b><span>Rooms</span></div><div class="card kpi"><b>${eur(cur.shop)}</b><span>Shop</span></div><div class="card kpi"><b>${eur(cur.rooms/Math.max(cur.nights,1))}</b><span>Average nightly rate</span></div></div>
 <div class="card"><h3>Last 6 months · rooms <i style="color:#6B7048">■</i> and shop <i style="color:#B7683E">■</i></h3>${bars(S.map(x=>x.rooms),ms.map(lab),600,150,eur,S.map(x=>x.shop))}</div>
 <div class="grid2" style="margin-top:14px"><div class="card wrap"><h3>By month</h3><table><tr><th>Month</th><th>Nights</th><th>Rooms</th><th>Shop</th><th>Total</th></tr>${S.map((x,i)=>`<tr><td>${lab(ms[i])}</td><td>${x.nights}</td><td>${eur(x.rooms)}</td><td>${eur(x.shop)}</td><td><b>${eur(x.rooms+x.shop)}</b></td></tr>`).join('')}</table></div>
 <div class="card wrap"><h3>This month by room type</h3><table><tr><th>Type</th><th>Nights</th><th>Revenue</th></tr>${TYPES.map(t=>`<tr><td>${t.name}</td><td>${cur.n[t.id]}</td><td>${eur(cur.t[t.id])}</td></tr>`).join('')}</table></div></div>
 <div class="card" style="margin-top:14px"><h3>Shop · Aurevia Pantry</h3><p class="note" style="margin:0 0 8px">${orders} orders this month, about €38 per order. Top sellers: olive oil 38%, wild honey 27%, wine 22%, other 13%.</p><a href="../pantry/#admin">Open the shop admin ↗</a></div>`}
function render(){tabs();const v=$('#view');v.innerHTML={overview,bookings,rooms,revenue}[tab]();
 if(tab==='bookings'){const f=()=>{F.q=$('#fq').value;F.status=$('#fs').value;F.type=$('#ft').value;const p=$('#fq').selectionStart;render();$('#fq').focus();$('#fq').setSelectionRange(p,p)};$('#fq').oninput=f;$('#fs').onchange=f;$('#ft').onchange=f}
 v.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.r))}
render();
</script></body></html>
