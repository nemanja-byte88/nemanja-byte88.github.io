 const bs=$('#bs');$('#bprev').onclick=()=>bs.scrollBy({left:-bs.clientWidth/2,behavior:'smooth'});$('#bnext').onclick=()=>bs.scrollBy({left:bs.clientWidth/2,behavior:'smooth'})}
function order(){if(view==='home')return home();const it=cartIt(),sub=money(it),f=it.length?fee(sub,O):0,box=`<div class="card"><h3>Your order</h3><table class="sum">${it.map(([id,q])=>`<tr><td>${q} × ${byId(id).n}</td><td align="right">${eur(up(id,q)*q)}${DEALS[id]&&q>=DEALS[id].min?` <span class="ok">−${DEALS[id].pc}%</span>`:''}</td></tr>`).join('')||'<tr><td class="mut">Nothing added yet.</td></tr>'}<tr class="t"><td>Goods</td><td align="right">${eur(sub)}</td></tr>${step>1?`<tr><td>${O.mode==='pickup'?'Pickup':'Delivery'}</td><td align="right">${f?eur(f):'Free'}</td></tr><tr class="t"><td>Total excl. VAT</td><td align="right">${eur(sub+f)}</td></tr>`:''}</table><p class="mut">Prices exclude VAT. Minimum order €150. Free delivery from €1,500.</p></div>`;
 const nav=['Products','Delivery','Company','Review'].map((s,i)=>`<span class="${i+1===step?'on':i+1<step?'done':''}">${i+1}. ${s}</span>`).join('');
 let b='';
 if(step===1){b=`<div class="cats">${CATS.map(c=>`<button class="${c===cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="pg" id="cat">${P.filter(p=>cat==='All'||p.g===cat).map(p=>{const av=S.stock[p.id];return `<div class="pc"><div class="ph g-${p.ab}"><span>${p.ab}</span><img src="img/${p.id}.webp" alt="" loading="lazy" onerror="this.remove()">${av<=LOWAT?`<em class="lb">${av>0?'Only '+av+' left':'Out of stock'}</em>`:''}${DEALS[p.id]?`<em class="lb rb">HOT −${DEALS[p.id].pc}% per pallet</em>`:BEST.includes(p.id)?'<em class="lb rb">Bestseller</em>':''}</div><div class="pb"><small>${p.g}</small><h4>${p.n}</h4><p class="mut">${p.u} · <b>${eur(p.p)}</b></p><div class="ctl"><button data-q="${p.id}" data-d="-1">−</button><input type="number" min="0" max="${av}" value="${cart[p.id]||0}" data-i="${p.id}" aria-label="Quantity"><button data-q="${p.id}" data-d="1">+</button><button class="pal" data-q="${p.id}" data-d="${p.pal}" title="One pallet">+ pallet</button></div><details><summary>Details</summary><p>${p.d}</p><p class="mut">${p.s} · ${p.pal} per pallet</p></details></div></div>`}).join('')}</div>`}
 if(step===2){const days=[2,3,4,5,6].map(n=>dstr(wd(n)));if(!O.date)O.date=days[0];
  b=`<div class="opt"><label class="${O.mode==='pickup'?'on':''}"><input type="radio" name="md" value="pickup" ${O.mode==='pickup'?'checked':''}>Pickup at our warehouse<br><span class="mut">Ljubljana · free · Mon–Fri</span></label><label class="${O.mode==='delivery'?'on':''}"><input type="radio" name="md" value="delivery" ${O.mode==='delivery'?'checked':''}>Delivery to site<br><span class="mut">By Kalmora freight</span></label></div>
  ${O.mode==='delivery'?`<label>Delivery zone</label><select id="zn">${Object.entries(ZONES).map(([k,v])=>`<option value="${k}" ${+O.zone===+k?'selected':''}>Zone ${k} · ${v[0]} · ${eur(v[1])}</option>`).join('')}</select>`:''}
  ${O.mode==='delivery'?'<p class="km">Delivered by <b>Kalmora</b> freight, with live tracking once dispatched. <a href="../kalmora/">About Kalmora ↗</a></p>':''}<div class="two"><div><label>${O.mode==='pickup'?'Pickup':'Delivery'} date</label><select id="dt">${days.map(d=>`<option ${O.date===d?'selected':''}>${d}</option>`).join('')}</select></div>${O.mode==='pickup'?`<div><label>Time slot</label><select id="sl">${SLOTS.map(s=>`<option ${O.slot===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}</div>`}
 if(step===3){const F=[['co','Company name'],['vat','VAT ID (e.g. SI12345678)'],['nm','Contact person'],['em','Email'],['ad','Site address (delivery)'],['ct','City (delivery)']].filter(f=>!['ad','ct'].includes(f[0])||O.mode==='delivery');b=`<div class="two">${F.map(f=>`<div><label>${f[1]}</label><input data-c="${f[0]}" value="${C[f[0]]||''}"></div>`).join('')}</div><p class="mut">Demo only: nothing is sent anywhere.</p>`}
 if(step===4){b=`<h3>Review</h3><p>${O.mode==='pickup'?'Pickup':'Delivery'}: <b>${O.date}${O.mode==='pickup'?' · '+O.slot:''}</b>${O.mode==='delivery'?` · Zone ${O.zone} · ${C.ad||''}, ${C.ct||''}`:''}</p><p>${C.co} · VAT ${C.vat} · ${C.nm} (${C.em})</p><p class="mut">Check the list on the right, then confirm. Stock is reserved straight away.</p>`}
 return `<div class="steps">${nav}</div><div class="lay"><div class="card">${b}<div class="acts"><button class="btn" id="bk">${step===1?'Home':'Back'}</button><button class="btn p" id="nx">${step===4?'Confirm order':'Continue'}</button></div></div>${box}</div>`}
function bindOrder(){if(view==='home')return bindHome();document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const id=b.dataset.q,n=Math.max(0,Math.min(S.stock[id],(cart[id]||0)+ +b.dataset.d));cart[id]=n;render()});
 document.querySelectorAll('[data-i]').forEach(i=>i.onchange=()=>{cart[i.dataset.i]=Math.max(0,Math.min(S.stock[i.dataset.i],+i.value||0));render()});
 document.querySelectorAll('[name=md]').forEach(r=>r.onchange=()=>{O.mode=r.value;render()});
 const z=$('#zn');if(z)z.onchange=()=>{O.zone=+z.value;render()};const d=$('#dt');if(d)d.onchange=()=>O.date=d.value;const s=$('#sl');if(s)s.onchange=()=>O.slot=s.value;
 document.querySelectorAll('[data-c]').forEach(i=>i.oninput=()=>C[i.dataset.c]=i.value);
 $('#bk').onclick=()=>{if(step===1)view='home';else step--;render();scrollTo(0,0)};
 $('#nx').onclick=()=>{const it=cartIt(),sub=money(it);
  if(step===1&&sub<150)return toast('Minimum order is €150. Add more products.');
  if(step===3){const need=['co','vat','nm','em'].concat(O.mode==='delivery'?['ad','ct']:[]);if(need.some(k=>!(C[k]||'').trim()))return toast('Please fill in all company fields.')}
  if(step<4){step++;return render()}
  const no=4100+S.orders.length+1,o={ref:'VQ-'+no,city:C.ct||'Ljubljana',co:C.co,mode:O.mode,zone:O.zone,when:O.date+(O.mode==='pickup'?' · '+O.slot:''),it,st:'New',t:Date.now(),sub,fee:fee(sub,O)};
  it.forEach(([id,q])=>S.stock[id]-=q);S.orders.unshift(o);save();LOG.unshift(`${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · Web order ${o.ref} placed by ${o.co}`);
  $('#app').innerHTML=`<div class="card" style="max-width:640px;margin:0 auto;text-align:center"><h2>Order received</h2><p>Your reference is <b>${o.ref}</b>.</p><p>${o.mode==='pickup'?'We will have it ready at the warehouse on':'We will deliver on'} <b>${o.when}</b>.</p>${o.mode==='delivery'?'<p class="mut">Delivery is arranged with Kalmora freight. You will get a KM tracking reference when the order is dispatched.</p>':''}<p class="mut">Open Staff login to see this order from the inside.</p><button class="btn p" id="ns">Start a new order</button> <button class="btn" id="gs">Staff login</button></div>`;
  $('#ns').onclick=()=>{cart={};C={};step=1;view='home';render()};$('#gs').onclick=()=>{cart={};C={};step=1;setMode('staff')}}}
/* ---------- staff ---------- */
const ROLES={owner:'Owner / General Manager',sales:'Sales',wh:'Warehouse'},TABS={dash:'Dashboard',orders:'Orders',stock:'Stock'},ACC={owner:['dash','orders','stock'],sales:['dash','orders'],wh:['dash','orders','stock']};
const NEXT={New:['Picking','Release to warehouse',['sales','owner']],Picking:['Ready','Mark ready',['wh','owner']],Ready:[null,null,['sales','owner']]};
const stamp=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const lowList=()=>P.filter(p=>S.stock[p.id]<=LOWAT);
function actBtn(o){const n=NEXT[o.st];if(!n)return '';const lab=o.st==='Ready'?(o.mode==='pickup'?'Confirm pickup':'Dispatch with Kalmora'):n[1];return `<button class="btn p" data-a="${o.ref}">${lab}</button>`}
function advance(ref){const o=S.orders.find(x=>x.ref===ref),n=NEXT[o.st];if(!n[2].includes(role)){LOG.unshift(`${stamp()} · ${ROLES[role]} tried to move ${ref} · blocked`);return toast(`Access denied for ${ROLES[role]}. The attempt was logged.`)}
 if(o.st==='Ready'){if(o.mode==='pickup')o.st='Collected';else{o.st='Dispatched';o.km='KM-'+(3101+S.orders.filter(x=>x.km).length);o.eta=dstr(wd(2));o.pal=Math.max(1,Math.ceil(o.it.reduce((a,[id,q])=>a+q/byId(id).pal,0)));o.shipSt='In transit'}}else o.st=n[0];
 LOG.unshift(`${stamp()} · ${ROLES[role]} moved ${ref} to ${o.st}`);save();toast(`${ref} is now ${o.st}${o.km?' · '+o.km:''}`);render()}
function dash(){const c=s=>S.orders.filter(o=>o.st===s).length,rev=S.orders.reduce((a,o)=>a+o.sub+o.fee,0),low=lowList();
 return `<div class="kpis"><div class="card kpi"><b>${c('New')}</b><span>New, to release</span></div><div class="card kpi"><b>${c('Picking')}</b><span>In picking</span></div><div class="card kpi"><b>${c('Ready')}</b><span>Ready to hand over</span></div>${role==='owner'?`<div class="card kpi"><b>${eur(rev).replace('.00','')}</b><span>Order value (sample week)</span></div>`:''}</div>
 <div class="grid2"><div class="card"><h3>Low stock</h3><ul class="l">${low.map(p=>`<li><span>${p.n}</span><b class="low">${S.stock[p.id]} left</b></li>`).join('')||'<li>All stock levels are fine.</li>'}</ul></div>
 <div class="card"><h3>${role==='owner'?'Activity and access log':'Your tasks'}</h3>${role==='owner'?`<ul class="l">${LOG.slice(0,6).map(l=>`<li>${l}</li>`).join('')||'<li class="mut">Nothing yet. Move an order, or try another role.</li>'}</ul>`:`<p class="mut">${role==='sales'?'Release new orders to the warehouse and hand over ready ones.':'Pick released orders, mark them ready and book new stock in.'}</p>`}</div></div>`}
function orders(){const wh=role==='wh';return `<div class="card wrap"><table><tr><th>Ref</th><th>Customer</th><th>Goods</th><th>${wh?'':'Total'}</th><th>Handover</th><th>Status</th><th></th></tr>${S.orders.map(o=>`<tr><td>${o.ref}</td><td>${o.co}</td><td class="mut">${o.it.map(([id,q])=>q+' × '+byId(id).n).join(', ')}</td><td>${wh?'':eur(o.sub+o.fee)}</td><td>${o.mode==='pickup'?'Pickup':'Delivery to '+o.city} · ${o.when}${o.km?`<br><a href="../kalmora/#track" data-km="${o.km}">Track ${o.km} ↗</a>`:''}</td><td><span class="pill s-${o.st.slice(0,2)}">${o.st}</span></td><td>${actBtn(o)}</td></tr>`).join('')}</table></div>`}
function stock(){const can=role!=='sales';return `<div class="card wrap"><table><tr><th>Product</th><th>Group</th><th>Unit</th><th>In stock</th><th></th></tr>${P.map(p=>`<tr><td>${p.n}</td><td>${p.g}</td><td>${p.u}</td><td class="${S.stock[p.id]<=LOWAT?'low':''}"><b>${S.stock[p.id]}</b>${S.stock[p.id]<=LOWAT?' · low':''}</td><td>${can?`<button class="btn" data-r="${p.id}">+ 1 pallet (${p.pal})</button>`:''}</td></tr>`).join('')}</table></div>`}
function staff(){const tb=Object.keys(TABS).map(k=>{const ok=ACC[role].includes(k);return `<button class="${k===tab?'on':''} ${ok?'':'lock'}" data-t="${k}">${ok?'':'🔒 '}${TABS[k]}</button>`}).join('');
 return `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px"><label style="margin:0">Signed in as <select id="rl" style="width:auto;display:inline-block">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}</select></label><button class="btn" id="rs">Reset demo data</button></div><div class="tabs">${tb}</div>${{dash,orders,stock}[tab]()}`}
function bindStaff(){$('#rl').onchange=e=>{role=e.target.value;if(!ACC[role].includes(tab))tab='dash';render();toast('Now viewing as '+ROLES[role])};
 $('#rs').onclick=()=>{try{localStorage.removeItem('vq-demo-v1')}catch(e){}load();LOG=[];render();toast('Demo data reset')};
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;if(!ACC[role].includes(k)){LOG.unshift(`${stamp()} · ${ROLES[role]} tried to open ${TABS[k]} · blocked`);return toast(`Access denied for ${ROLES[role]}. The attempt was logged.`)}tab=k;render()});
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>advance(b.dataset.a));document.querySelectorAll('[data-km]').forEach(a=>a.onclick=()=>{try{localStorage.setItem('km-prefill',a.dataset.km)}catch(e){}});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const p=byId(b.dataset.r);S.stock[p.id]+=p.pal;LOG.unshift(`${stamp()} · ${ROLES[role]} booked in ${p.pal} × ${p.n}`);save();toast('Stock updated');render()})}
function setMode(m){mode=m;const kk=$('#kmc');if(kk&&m==='staff')kk.remove();$('#m-order').classList.toggle('on',m==='order');$('#m-staff').classList.toggle('on',m==='staff');history.replaceState(null,'',m==='staff'?'#staff':location.pathname);render()}
function render(){const a=$('#app'),y=scrollY;if(mode==='order'){a.innerHTML=order();bindOrder()}else{a.innerHTML=staff();bindStaff()}scrollTo(0,y)}
$('#m-order').onclick=()=>{view='home';step=1;setMode('order')};document.querySelector('.logo').onclick=()=>{view='home';step=1;setMode('order')};$('#m-staff').onclick=()=>setMode('staff');
mode=location.hash==='#staff'?'staff':'order';$('#m-order').classList.toggle('on',mode==='order');$('#m-staff').classList.toggle('on',mode==='staff');render();
setTimeout(()=>{try{if(mode!=='order'||sessionStorage.getItem('vq-km'))return;sessionStorage.setItem('vq-km','1')}catch(e){return}const d=document.createElement('div');d.id='kmc';d.innerHTML='<b>Need freight across the region?</b><br>Kalmora delivers from Ljubljana to Austria, Croatia and the Balkans. <a href="../kalmora/">See Kalmora ↗</a><button aria-label="Close">×</button>';d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)},6000);
</script></body></html>
